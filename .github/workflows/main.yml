name: HAPI FHIR CI/CD Pipeline

on:
  push:
    branches:
      - main

#  pull_request: 
#    branches:
#      - main


env:
  IMAGE_NAME: CI/CD TESTING
  JAVA_VERSION: 17
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 3. Cache Maven dependencies
      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build HAPI FHIR project
      - name: Build Project
        run: mvn clean install -DskipTests
	working-directory: hapi-fhir-jpaserver

      # 5. Run Unit Tests
      - name: Run Tests
        run: mvn test
	working-directory: hapi-fhir-jpaserver

      # 6. Setup QEMU for ARM builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Login to DockerHub
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Extract Docker metadata
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      # 10. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}

      # 11. Verify Docker Image
      - name: Verify Docker Image
        run: docker images
